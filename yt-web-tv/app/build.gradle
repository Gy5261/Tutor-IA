plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cossio.ytwebtv'
    compileSdk 37

    defaultConfig {
        applicationId 'com.cossio.ytwebtv'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            debuggable false
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
